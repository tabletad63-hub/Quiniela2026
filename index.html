<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiniela + Elige 8</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ---------------------------------------------------------
   Datos / utilidades
--------------------------------------------------------- */
const PICKS = ["1", "X", "2"];
const GOLES = ["0", "1", "2", "3", "M"];
const N = 14;
const PRECIO_COLUMNA = 0.75;
const PRECIO_ELIGE8 = 0.5;
const NUM_COLUMNAS = 2;
const SALA_PARAM = "sala";

const nuevoPartido = () => ({ local: "", visitante: "" });

const nuevaJornada = (numero, pagador = "A") => ({
  id: `j${Date.now()}`,
  numero,
  fecha: new Date().toISOString().slice(0, 10),
  pagador,
  jugarElige8: true,
  elige8: Array(N).fill(false),
  partidos: Array.from({ length: N }, nuevoPartido),
  pleno: { local: "", visitante: "", prediccion: { l: null, v: null } },
  columnas: { A: { picks: Array(N).fill(null) }, B: { picks: Array(N).fill(null) } },
  resultado: { picks: Array(N).fill(null), pleno: { l: null, v: null } },
});

const datosPorDefecto = () => ({ personas: { A: "Tú", B: "Amigo" }, jornadas: [], premios: [] });

function costeDe(jornada) {
  return NUM_COLUMNAS * PRECIO_COLUMNA + (jornada.jugarElige8 ? PRECIO_ELIGE8 : 0);
}
function aciertosDe(jornada, col, indices = null) {
  const picks = jornada.columnas[col].picks;
  const res = jornada.resultado.picks;
  const idxs = indices ?? picks.map((_, i) => i);
  let aciertos = 0, resueltos = 0;
  idxs.forEach((i) => {
    if (res[i]) { resueltos++; if (picks[i] && picks[i] === res[i]) aciertos++; }
  });
  return { aciertos, resueltos, total: idxs.length };
}
function elige8Info(jornada) {
  if (!jornada.jugarElige8) return { jugado: false, seleccionadas: 0, completo: false, aciertos: 0, resueltos: 0 };
  const principal = jornada.pagador;
  const idxs = jornada.elige8.map((v, i) => (v ? i : null)).filter((v) => v !== null);
  const completo = idxs.length === 8;
  const { aciertos, resueltos } = aciertosDe(jornada, principal, idxs);
  return { jugado: true, principal, idxs, seleccionadas: idxs.length, completo, aciertos, resueltos };
}
function plenoAcertado(jornada) {
  const p = jornada.pleno.prediccion, r = jornada.resultado.pleno;
  if (!r.l || !r.v || !p.l || !p.v) return null;
  return p.l === r.l && p.v === r.v;
}
function otraPersona(col) { return col === "A" ? "B" : "A"; }

/* ---------------------------------------------------------
   Almacén compartido GRATIS vía jsonblob.com (sin cuenta, sin coste)
   El identificador de la "sala" viaja en la URL (?sala=ID) para que
   ambos abráis el mismo cajón de datos.
--------------------------------------------------------- */
const API = "https://jsonblob.com/api/jsonBlob";

function getSalaIdDeUrl() {
  return new URLSearchParams(window.location.search).get(SALA_PARAM);
}
async function crearSala(datosIniciales) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datosIniciales),
  });
  const loc = res.headers.get("Location") || res.headers.get("location") || "";
  return loc.split("/").pop();
}
async function leerSala(id) {
  const res = await fetch(`${API}/${id}`);
  if (!res.ok) throw new Error("No se pudo leer la sala");
  return await res.json();
}
async function guardarSala(id, datos) {
  await fetch(`${API}/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos),
  });
}

/* ---------------------------------------------------------
   App
--------------------------------------------------------- */
function QuinielaApp() {
  const [salaId, setSalaId] = useState(null);
  const [data, setData] = useState(null);
  const [estado, setEstado] = useState("cargando"); // cargando | ok | error
  const [tab, setTab] = useState("jornadas");
  const [selectedId, setSelectedId] = useState(null);
  const [editingNames, setEditingNames] = useState(false);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      let id = getSalaIdDeUrl();
      try {
        if (id) {
          const remoto = await leerSala(id);
          setData(remoto);
          if (remoto.jornadas?.length) setSelectedId(remoto.jornadas[0].id);
        } else {
          const inicial = datosPorDefecto();
          id = await crearSala(inicial);
          const url = new URL(window.location.href);
          url.searchParams.set(SALA_PARAM, id);
          window.history.replaceState({}, "", url.toString());
          setData(inicial);
        }
        setSalaId(id);
        setEstado("ok");
      } catch (e) {
        console.error(e);
        setData(datosPorDefecto());
        setEstado("error");
      }
    })();
  }, []);

  useEffect(() => {
    const onVisible = async () => {
      if (document.visibilityState === "visible" && salaId) {
        try {
          const remoto = await leerSala(salaId);
          setData(remoto);
        } catch (e) {}
      }
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [salaId]);

  const persist = useCallback((next) => {
    setData(next);
    if (!salaId) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => { guardarSala(salaId, next).catch(console.error); }, 400);
  }, [salaId]);

  const sincronizar = async () => {
    if (!salaId) return;
    try { setData(await leerSala(salaId)); } catch (e) {}
  };

  const jornadas = data?.jornadas ?? [];
  const jornadaSeleccionada = jornadas.find((j) => j.id === selectedId) || jornadas[0];

  const actualizarJornada = (id, updater) => persist({ ...data, jornadas: data.jornadas.map((j) => (j.id === id ? updater(j) : j)) });

  const crearJornada = () => {
    const numero = (jornadas.reduce((m, j) => Math.max(m, j.numero), 0) || 0) + 1;
    const ultima = jornadas[0];
    const pagador = ultima ? otraPersona(ultima.pagador) : "A";
    const j = nuevaJornada(numero, pagador);
    persist({ ...data, jornadas: [j, ...data.jornadas] });
    setSelectedId(j.id);
    setTab("jornadas");
  };

  const borrarJornada = (id) => {
    const next = { ...data, jornadas: data.jornadas.filter((j) => j.id !== id) };
    persist(next);
    if (selectedId === id) setSelectedId(next.jornadas[0]?.id ?? null);
  };

  const renombrarPersona = (col, nombre) => persist({ ...data, personas: { ...data.personas, [col]: nombre || (col === "A" ? "Tú" : "Amigo") } });

  if (estado === "cargando" || !data) {
    return <div className="min-h-screen flex items-center justify-center bg-white text-[#1A1A1A]">Cargando boleto…</div>;
  }

  const linkSala = salaId ? `${window.location.origin}${window.location.pathname}?sala=${salaId}` : "";

  return (
    <div className="min-h-screen bg-[#F2F2F2] text-[#1A1A1A]">
      <Estilos />
      {estado === "error" && (
        <div className="bg-yellow-100 text-yellow-900 text-xs px-4 py-2 text-center">
          No se pudo conectar con el almacenamiento compartido. Tus cambios solo se guardarán en esta pestaña.
        </div>
      )}
      <BarraSala link={linkSala} />
      <Marcador data={data} editingNames={editingNames} setEditingNames={setEditingNames} renombrarPersona={renombrarPersona} onSincronizar={sincronizar} />
      <Tabs tab={tab} setTab={setTab} />
      <main className="max-w-6xl mx-auto px-3 sm:px-4 pb-16 pt-4">
        {tab === "jornadas" && (
          <VistaJornadas data={data} jornadas={jornadas} seleccionada={jornadaSeleccionada} setSelectedId={setSelectedId} crearJornada={crearJornada} borrarJornada={borrarJornada} actualizarJornada={actualizarJornada} />
        )}
        {tab === "historial" && <VistaHistorial data={data} setSelectedId={setSelectedId} setTab={setTab} />}
        {tab === "bote" && <VistaBote data={data} persist={persist} />}
        {tab === "stats" && <VistaEstadisticas data={data} />}
      </main>
    </div>
  );
}

function BarraSala({ link }) {
  const [copiado, setCopiado] = useState(false);
  if (!link) return null;
  const copiar = async () => {
    try { await navigator.clipboard.writeText(link); setCopiado(true); setTimeout(() => setCopiado(false), 1500); } catch (e) {}
  };
  return (
    <div className="bg-[#1565C0] text-white text-xs px-3 py-2 flex flex-wrap items-center justify-center gap-2 text-center">
      <span>Comparte este enlace con tu amigo para que veáis los mismos datos:</span>
      <button onClick={copiar} className="bg-white text-[#1565C0] font-bold px-2 py-0.5 rounded">{copiado ? "¡Copiado!" : "Copiar enlace"}</button>
    </div>
  );
}

function Marcador({ data, editingNames, setEditingNames, renombrarPersona, onSincronizar }) {
  const totalJugado = data.jornadas.reduce((s, j) => s + costeDe(j), 0);
  return (
    <>
      <header className="bg-[#E30613] text-white">
        <div className="max-w-6xl mx-auto px-3 sm:px-4 py-3 flex items-center gap-3">
          <div className="logo-box"><span>18</span></div>
          <h1 className="text-lg sm:text-2xl font-black uppercase tracking-tight leading-none">
            LA QUINIELA <span className="opacity-80 font-bold text-sm sm:text-base">+ Elige 8</span>
          </h1>
          <button onClick={onSincronizar} className="ml-auto bg-white/20 hover:bg-white/30 text-xs font-bold px-2.5 py-1.5 rounded" title="Traer los últimos cambios de tu amigo">
            ⟳ Sincronizar
          </button>
        </div>
      </header>
      <div className="bg-white border-b border-[#E5E5E5]">
        <div className="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 flex items-center justify-between gap-4 text-sm">
          {editingNames ? (
            <NombresEditor data={data} renombrarPersona={renombrarPersona} onDone={() => setEditingNames(false)} />
          ) : (
            <button onClick={() => setEditingNames(true)} className="flex items-center gap-1.5 text-[#1565C0] font-semibold hover:opacity-70">
              ✏️ <span>{data.personas.A} <span className="opacity-50 font-normal">vs</span> {data.personas.B}</span>
            </button>
          )}
          <div className="flex items-center gap-4 text-xs text-[#1A1A1A]/60">
            <span>Jornadas: <b className="text-[#1A1A1A]">{data.jornadas.length}</b></span>
            <span>Jugado: <b className="text-[#E30613]">{totalJugado.toFixed(2)}€</b></span>
          </div>
        </div>
      </div>
    </>
  );
}

function NombresEditor({ data, renombrarPersona, onDone }) {
  const [a, setA] = useState(data.personas.A);
  const [b, setB] = useState(data.personas.B);
  return (
    <div className="flex items-center gap-2">
      <input value={a} onChange={(e) => setA(e.target.value)} className="input-mini w-24" placeholder="Jugador A" />
      <span className="opacity-50">vs</span>
      <input value={b} onChange={(e) => setB(e.target.value)} className="input-mini w-24" placeholder="Jugador B" />
      <button onClick={() => { renombrarPersona("A", a); renombrarPersona("B", b); onDone(); }} className="text-[#E30613] font-bold">✔</button>
    </div>
  );
}

function Tabs({ tab, setTab }) {
  const items = [
    { id: "jornadas", label: "Boleto", icon: "📋" },
    { id: "historial", label: "Historial", icon: "🏆" },
    { id: "bote", label: "Bote", icon: "💰" },
    { id: "stats", label: "Estadísticas", icon: "📊" },
  ];
  return (
    <nav className="max-w-6xl mx-auto px-3 sm:px-4 flex gap-1 bg-white border-b border-[#E5E5E5] overflow-x-auto">
      {items.map(({ id, label, icon }) => (
        <button key={id} onClick={() => setTab(id)} className={`tab-btn flex items-center gap-1.5 ${tab === id ? "tab-active" : ""}`}>
          <span>{icon}</span>{label}
        </button>
      ))}
    </nav>
  );
}

function VistaJornadas({ data, jornadas, seleccionada, setSelectedId, crearJornada, borrarJornada, actualizarJornada }) {
  return (
    <div className="flex flex-col sm:flex-row gap-4 mt-4">
      <aside className="sidebar-jornadas space-y-2">
        <button onClick={crearJornada} className="btn-rojo w-full flex items-center justify-center gap-1.5">+ Nueva jornada</button>
        <div className="space-y-1 max-h-[70vh] overflow-y-auto pr-1">
          {jornadas.map((j) => (
            <button key={j.id} onClick={() => setSelectedId(j.id)}
              className={`w-full text-left px-3 py-2 rounded border text-sm transition-colors ${seleccionada?.id === j.id ? "border-[#E30613] bg-[#E30613]/5 text-[#1A1A1A]" : "border-[#E5E5E5] text-[#1A1A1A]/60 hover:border-[#1565C0]/50"}`}>
              <div className="font-bold">Jornada {j.numero}</div>
              <div className="text-xs opacity-70">{j.fecha}</div>
            </button>
          ))}
          {jornadas.length === 0 && <p className="text-sm text-[#1A1A1A]/50 px-1 pt-2">Todavía no hay jornadas. Crea la primera.</p>}
        </div>
      </aside>
      <div className="flex-1 min-w-0">
        {seleccionada ? (
          <Boleto key={seleccionada.id} jornada={seleccionada} personas={data.personas} onChange={(u) => actualizarJornada(seleccionada.id, u)} onDelete={() => borrarJornada(seleccionada.id)} />
        ) : <p className="text-[#1A1A1A]/60">Selecciona o crea una jornada para empezar a rellenar el boleto.</p>}
      </div>
    </div>
  );
}

function Boleto({ jornada, personas, onChange, onDelete }) {
  const orden = [jornada.pagador, otraPersona(jornada.pagador)];

  const setPartido = (i, campo, valor) => onChange((j) => ({ ...j, partidos: j.partidos.map((p, idx) => (idx === i ? { ...p, [campo]: valor } : p)) }));
  const setPick = (col, i, valor) => onChange((j) => {
    const actual = j.columnas[col].picks[i];
    const picks = j.columnas[col].picks.map((p, idx) => (idx === i ? (actual === valor ? null : valor) : p));
    return { ...j, columnas: { ...j.columnas, [col]: { ...j.columnas[col], picks } } };
  });
  const toggleElige8 = (i) => onChange((j) => {
    if (!j.jugarElige8) return j;
    const actual = j.elige8;
    const yaSeleccionado = actual[i];
    const totalSeleccionadas = actual.filter(Boolean).length;
    if (!yaSeleccionado && totalSeleccionadas >= 8) return j;
    return { ...j, elige8: actual.map((v, idx) => (idx === i ? !v : v)) };
  });
  const setResultado = (i, valor) => onChange((j) => {
    const actual = j.resultado.picks[i];
    const picks = j.resultado.picks.map((p, idx) => (idx === i ? (actual === valor ? null : valor) : p));
    return { ...j, resultado: { ...j.resultado, picks } };
  });
  const setPlenoEquipo = (campo, valor) => onChange((j) => ({ ...j, pleno: { ...j.pleno, [campo]: valor } }));
  const setPlenoPrediccion = (campo, valor) => onChange((j) => ({ ...j, pleno: { ...j.pleno, prediccion: { ...j.pleno.prediccion, [campo]: valor } } }));
  const setPlenoResultado = (campo, valor) => onChange((j) => ({ ...j, resultado: { ...j.resultado, pleno: { ...j.resultado.pleno, [campo]: valor } } }));
  const setPagador = (nuevo) => onChange((j) => ({ ...j, pagador: nuevo }));
  const setJugarElige8 = (val) => onChange((j) => ({ ...j, jugarElige8: val }));

  const [mostrarImportar, setMostrarImportar] = useState(false);
  const [textoImportar, setTextoImportar] = useState("");
  const [errorImportar, setErrorImportar] = useState("");

  const importarDatos = () => {
    try {
      const datos = JSON.parse(textoImportar);
      if (!Array.isArray(datos.partidos) || datos.partidos.length !== 14) { setErrorImportar("El bloque debe tener exactamente 14 partidos."); return; }
      onChange((j) => {
        const partidos = datos.partidos.map((p) => ({ local: p.local || "", visitante: p.visitante || "" }));
        const pleno = { ...j.pleno };
        if (datos.pleno) { pleno.local = datos.pleno.local || pleno.local; pleno.visitante = datos.pleno.visitante || pleno.visitante; }
        let resultado = j.resultado;
        if (Array.isArray(datos.resultados) && datos.resultados.length === 14) resultado = { ...resultado, picks: datos.resultados.map((r) => (r ? String(r) : null)) };
        if (datos.resultadoPleno) resultado = { ...resultado, pleno: { l: datos.resultadoPleno.l ?? resultado.pleno.l, v: datos.resultadoPleno.v ?? resultado.pleno.v } };
        return { ...j, partidos, pleno, resultado };
      });
      setErrorImportar(""); setTextoImportar(""); setMostrarImportar(false);
    } catch (e) { setErrorImportar("Ese texto no tiene un formato válido. Pide a Claude que te lo regenere."); }
  };

  const acA = aciertosDe(jornada, "A");
  const acB = aciertosDe(jornada, "B");
  const e8 = elige8Info(jornada);
  const pleno = plenoAcertado(jornada);
  const coste = costeDe(jornada);

  return (
    <div className="boleto rounded-md overflow-hidden">
      <div className="flex items-center justify-between px-4 py-3 border-b border-[#E5E5E5]">
        <div className="flex items-center gap-3">
          <span className="text-lg font-black text-[#1A1A1A]">JORNADA {jornada.numero}</span>
          <input type="date" value={jornada.fecha} onChange={(e) => onChange((j) => ({ ...j, fecha: e.target.value }))} className="input-plain text-xs" />
        </div>
        <button onClick={onDelete} className="text-[#1A1A1A]/40 hover:text-[#E30613]" title="Borrar jornada">🗑</button>
      </div>

      <div className="flex flex-wrap items-center gap-4 px-4 py-2.5 border-b border-[#E5E5E5] bg-[#FAFAFA] text-sm">
        <label className="flex items-center gap-1.5">Paga esta jornada:
          <select value={jornada.pagador} onChange={(e) => setPagador(e.target.value)} className="input-plain">
            <option value="A">{personas.A}</option><option value="B">{personas.B}</option>
          </select>
        </label>
        <label className="flex items-center gap-1.5">
          <input type="checkbox" checked={jornada.jugarElige8} onChange={(e) => setJugarElige8(e.target.checked)} />
          Jugar Elige 8 (+{PRECIO_ELIGE8.toFixed(2)}€)
        </label>
        <span className="ml-auto font-bold text-[#E30613]">Coste total: {coste.toFixed(2)}€</span>
      </div>

      <div className="px-4 pt-3">
        <button onClick={() => setMostrarImportar((v) => !v)} className="text-xs font-bold text-[#1565C0] underline">
          {mostrarImportar ? "Cerrar importador" : "Importar partidos / resultados (pegar desde el chat)"}
        </button>
        {mostrarImportar && (
          <div className="mt-2 border border-[#1565C0]/30 rounded-md p-3 bg-[#F5F9FE]">
            <p className="text-xs text-[#1A1A1A]/70 mb-2">Pídeme en el chat: "dame los partidos/resultados de la jornada X en formato para importar". Pega aquí el bloque y pulsa Importar.</p>
            <textarea value={textoImportar} onChange={(e) => setTextoImportar(e.target.value)}
              placeholder='{"partidos":[{"local":"Alavés","visitante":"Getafe"}, ...14], "pleno":{"local":"...","visitante":"..."}, "resultados":["1","X",...], "resultadoPleno":{"l":"1","v":"0"}}'
              className="w-full h-24 text-xs font-mono border border-[#D0D0D0] rounded p-2 outline-none focus:border-[#1565C0]" />
            {errorImportar && <p className="text-xs text-[#E30613] mt-1">{errorImportar}</p>}
            <button onClick={importarDatos} className="btn-rojo mt-2">Importar y rellenar</button>
          </div>
        )}
      </div>

      <p className="px-4 pt-3 text-[#1A1A1A]/70 text-sm">Selecciona un pronóstico por partido. La columna de quien paga juega el Elige 8: toca el partido para marcarlo.</p>

      {jornada.jugarElige8 && (
        <div className="mx-4 mt-3">
          <div className="ribbon">
            <span className="ribbon-text">Juego <b>OPCIONAL</b> con tu Quiniela habitual <span className="ribbon-arrow">««</span> <span className="elige8-logo">ELIGE<span className="elige8-ocho">8</span></span></span>
          </div>
          <p className="text-center font-bold text-sm mt-1 text-[#1565C0]">Seleccionados: {e8.seleccionadas}/8 · columna de {personas[jornada.pagador]}</p>
        </div>
      )}

      <div className="tabla-scroll">
        <div className="tabla-inner">
          <div className="flex gap-2 px-4 pt-3 text-[11px] font-bold uppercase tracking-wide text-[#1A1A1A]/50">
            <div className="partido-hueco" />
            {orden.map((col, idx) => (
              <div key={col} className="col-fija text-center">{personas[col]}{idx === 0 && jornada.jugarElige8 && <div className="text-[9px] text-[#1565C0]">Elige 8</div>}</div>
            ))}
            <div className="col-fija text-center">Resultado</div>
          </div>
          <div className="px-4 pb-2 space-y-1.5 pt-1">
            {jornada.partidos.map((p, i) => {
              const marcado = jornada.elige8[i];
              return (
                <div key={i} className="fila-partido">
                  <button onClick={() => toggleElige8(i)} className={`partido-box ${marcado ? "partido-marcado" : ""}`} title="Pulsa para incluir este partido en el Elige 8">
                    <span className="partido-num">{i + 1}.</span>
                    <input value={p.local} onChange={(e) => setPartido(i, "local", e.target.value)} onClick={(e) => e.stopPropagation()} placeholder="Local" className="partido-input" />
                    <span className="opacity-50">-</span>
                    <input value={p.visitante} onChange={(e) => setPartido(i, "visitante", e.target.value)} onClick={(e) => e.stopPropagation()} placeholder="Visitante" className="partido-input" />
                  </button>
                  {orden.map((col) => (
                    <div key={col} className="col-fija"><PickGroup valor={jornada.columnas[col].picks[i]} resultado={jornada.resultado.picks[i]} onPick={(v) => setPick(col, i, v)} /></div>
                  ))}
                  <div className="col-fija"><PickGroup resultadoMode valor={jornada.resultado.picks[i]} onPick={(v) => setResultado(i, v)} /></div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <h3 className="px-4 pt-2 text-[#E30613] font-black uppercase tracking-wide">Pleno al quince</h3>
      <p className="px-4 text-xs text-[#1A1A1A]/50">Una única predicción para el boleto (no una por columna).</p>
      <div className="mx-4 mt-1 mb-3 border border-[#E5E5E5] rounded-md">
        <div className="px-3 py-2 flex flex-wrap items-center gap-2 text-sm border-b border-[#E5E5E5]">
          <input value={jornada.pleno.local} onChange={(e) => setPlenoEquipo("local", e.target.value)} placeholder="Local" className="input-plain w-24" />
          <span className="opacity-40">-</span>
          <input value={jornada.pleno.visitante} onChange={(e) => setPlenoEquipo("visitante", e.target.value)} placeholder="Visitante" className="input-plain w-24" />
        </div>
        <div className="grid grid-cols-2 gap-2 px-3 py-3 text-xs">
          <PlenoSelector titulo="Vuestra predicción" valor={jornada.pleno.prediccion} onChange={setPlenoPrediccion} />
          <PlenoSelector titulo="Resultado real" valor={jornada.resultado.pleno} onChange={setPlenoResultado} />
        </div>
      </div>

      <div className="flex flex-wrap items-center gap-4 px-4 py-3 border-t border-[#E5E5E5] text-xs font-bold uppercase">
        <span className={acA.resueltos > 0 ? "text-[#1A1A1A]" : "text-[#1A1A1A]/30"}>{personas.A}: {acA.aciertos}/14</span>
        <span className={acB.resueltos > 0 ? "text-[#1A1A1A]" : "text-[#1A1A1A]/30"}>{personas.B}: {acB.aciertos}/14</span>
        <span className={pleno !== null ? "text-[#1A1A1A]" : "text-[#1A1A1A]/30"}>Pleno al 15: {pleno === null ? "pendiente" : pleno ? "✓ acertado" : "✗ fallado"}</span>
        {jornada.jugarElige8 && <span className={e8.completo && e8.resueltos > 0 ? "text-[#E30613]" : "text-[#1A1A1A]/30"}>Elige 8: {e8.completo ? `${e8.aciertos}/8` : "faltan por marcar"}</span>}
      </div>
    </div>
  );
}

function PickGroup({ valor, onPick, resultado, resultadoMode }) {
  return (
    <div className={`pick-group ${resultadoMode ? "pick-group-resultado" : ""}`}>
      {PICKS.map((op) => {
        const seleccionado = valor === op;
        let estado = "";
        if (!resultadoMode && resultado) { if (seleccionado && op === resultado) estado = "acierto"; else if (seleccionado && op !== resultado) estado = "fallo"; }
        return <button key={op} onClick={() => onPick(op)} className={`casilla ${resultadoMode ? "casilla-resultado" : ""} ${seleccionado ? "casilla-on" : ""} ${estado}`}>{op}</button>;
      })}
    </div>
  );
}

function PlenoSelector({ titulo, valor, onChange }) {
  return (
    <div>
      <p className="text-center font-bold uppercase text-[10px] text-[#1A1A1A]/50 mb-1">{titulo}</p>
      <div className="flex items-center justify-center gap-1">
        <select value={valor.l ?? ""} onChange={(e) => onChange("l", e.target.value || null)} className="input-plain w-11 text-center">
          <option value="" />{GOLES.map((g) => <option key={g} value={g}>{g}</option>)}
        </select>
        <span>-</span>
        <select value={valor.v ?? ""} onChange={(e) => onChange("v", e.target.value || null)} className="input-plain w-11 text-center">
          <option value="" />{GOLES.map((g) => <option key={g} value={g}>{g}</option>)}
        </select>
      </div>
    </div>
  );
}

function VistaHistorial({ data, setSelectedId, setTab }) {
  const filas = [...data.jornadas].sort((a, b) => b.numero - a.numero);
  return (
    <div className="boleto rounded-md overflow-x-auto mt-4">
      <table className="w-full text-sm">
        <thead>
          <tr className="text-left text-[11px] uppercase tracking-wide text-[#1A1A1A]/50 border-b border-[#E5E5E5]">
            <th className="px-3 py-2">Jornada</th><th className="px-3 py-2">Fecha</th>
            <th className="px-3 py-2 text-center">{data.personas.A}</th><th className="px-3 py-2 text-center">{data.personas.B}</th>
            <th className="px-3 py-2 text-center">Elige 8</th><th className="px-3 py-2 text-center">Pleno</th>
            <th className="px-3 py-2 text-right">Coste</th><th className="px-3 py-2">Pagó</th>
          </tr>
        </thead>
        <tbody>
          {filas.map((j) => {
            const a = aciertosDe(j, "A"), b = aciertosDe(j, "B"), e8 = elige8Info(j), pleno = plenoAcertado(j);
            const ganaA = a.aciertos > b.aciertos, ganaB = b.aciertos > a.aciertos;
            return (
              <tr key={j.id} className="border-b border-[#E5E5E5] hover:bg-[#E30613]/5 cursor-pointer" onClick={() => { setSelectedId(j.id); setTab("jornadas"); }}>
                <td className="px-3 py-2 font-bold">#{j.numero}</td>
                <td className="px-3 py-2 opacity-70">{j.fecha}</td>
                <td className={`px-3 py-2 text-center font-bold ${ganaA ? "text-[#1565C0]" : "opacity-50"}`}>{a.aciertos}/14</td>
                <td className={`px-3 py-2 text-center font-bold ${ganaB ? "text-[#1565C0]" : "opacity-50"}`}>{b.aciertos}/14</td>
                <td className="px-3 py-2 text-center">{e8.jugado ? (e8.completo ? `${e8.aciertos}/8` : "sin marcar") : "—"}</td>
                <td className="px-3 py-2 text-center text-xs">{pleno === null ? "—" : pleno ? "★ acertado" : "fallado"}</td>
                <td className="px-3 py-2 text-right">{costeDe(j).toFixed(2)}€</td>
                <td className="px-3 py-2">{data.personas[j.pagador]}</td>
              </tr>
            );
          })}
          {filas.length === 0 && <tr><td colSpan={8} className="px-3 py-6 text-center opacity-50">Sin jornadas todavía.</td></tr>}
        </tbody>
      </table>
    </div>
  );
}

function VistaBote({ data, persist }) {
  const [importe, setImporte] = useState("");
  const [nota, setNota] = useState("");
  const totalCoste = data.jornadas.reduce((s, j) => s + costeDe(j), 0);
  const pagadoPorA = data.jornadas.filter((j) => j.pagador === "A").reduce((s, j) => s + costeDe(j), 0);
  const pagadoPorB = totalCoste - pagadoPorA;
  const saldo = (pagadoPorA - pagadoPorB) / 2;
  const totalPremios = data.premios.reduce((s, p) => s + (Number(p.importe) || 0), 0);
  const anadirPremio = () => {
    if (!importe) return;
    const p = { id: `p${Date.now()}`, importe: Number(importe), nota, fecha: new Date().toISOString().slice(0, 10) };
    persist({ ...data, premios: [p, ...data.premios] }); setImporte(""); setNota("");
  };
  const borrarPremio = (id) => persist({ ...data, premios: data.premios.filter((p) => p.id !== id) });
  return (
    <div className="space-y-4 mt-4">
      <div className="boleto rounded-md p-5">
        <h2 className="text-lg font-black text-[#1A1A1A] mb-3">Saldo entre vosotros</h2>
        <div className="grid sm:grid-cols-3 gap-3 text-center">
          <div className="stat-box"><p className="stat-label">Pagado por {data.personas.A}</p><p className="stat-num">{pagadoPorA.toFixed(2)}€</p></div>
          <div className="stat-box"><p className="stat-label">Pagado por {data.personas.B}</p><p className="stat-num">{pagadoPorB.toFixed(2)}€</p></div>
          <div className="stat-box bg-[#E30613]/5"><p className="stat-label">Total jugado</p><p className="stat-num text-[#E30613]">{totalCoste.toFixed(2)}€</p></div>
        </div>
        <p className="mt-4 text-center text-sm">
          {saldo === 0 && "Estáis a la par, nadie debe nada."}
          {saldo > 0 && <><b>{data.personas.B}</b> le debe a <b>{data.personas.A}</b> <span className="text-[#E30613] font-bold">{saldo.toFixed(2)}€</span></>}
          {saldo < 0 && <><b>{data.personas.A}</b> le debe a <b>{data.personas.B}</b> <span className="text-[#E30613] font-bold">{Math.abs(saldo).toFixed(2)}€</span></>}
        </p>
      </div>
      <div className="boleto rounded-md p-5">
        <h2 className="text-lg font-black text-[#1A1A1A] mb-1">Premios ganados</h2>
        <p className="text-xs text-[#1A1A1A]/60 mb-3">Registra aquí el dinero que hayáis ganado con la quiniela real. Se reparte a partes iguales.</p>
        <div className="flex flex-wrap gap-2 mb-3">
          <input type="number" step="0.01" placeholder="Importe €" value={importe} onChange={(e) => setImporte(e.target.value)} className="input-plain w-28" />
          <input placeholder="Nota (ej. jornada 12)" value={nota} onChange={(e) => setNota(e.target.value)} className="input-plain flex-1 min-w-[140px]" />
          <button onClick={anadirPremio} className="btn-rojo">Añadir premio</button>
        </div>
        <div className="divide-y divide-[#E5E5E5]">
          {data.premios.map((p) => (
            <div key={p.id} className="flex items-center justify-between py-2 text-sm">
              <div><span className="font-bold">{Number(p.importe).toFixed(2)}€</span> <span className="opacity-60">— {p.nota || "sin nota"}</span><span className="opacity-40 ml-2 text-xs">{p.fecha}</span></div>
              <button onClick={() => borrarPremio(p.id)} className="text-[#1A1A1A]/40 hover:text-[#E30613]">🗑</button>
            </div>
          ))}
          {data.premios.length === 0 && <p className="text-sm opacity-50 py-2">Todavía no habéis registrado premios.</p>}
        </div>
        {data.premios.length > 0 && <p className="text-right text-sm font-bold mt-2 text-[#1A1A1A]">Total ganado: <span className="text-[#E30613]">{totalPremios.toFixed(2)}€</span> ({(totalPremios / 2).toFixed(2)}€ cada uno)</p>}
      </div>
    </div>
  );
}

function VistaEstadisticas({ data }) {
  const stats = useMemo(() => {
    const base = { A: { aciertos: 0, resueltos: 0, mejor: 0 }, B: { aciertos: 0, resueltos: 0, mejor: 0 }, e8: { aciertos: 0, resueltos: 0, jornadas: 0, mejor: 0 }, plenos: 0, jornadasConPleno: 0 };
    data.jornadas.forEach((j) => {
      ["A", "B"].forEach((col) => {
        const { aciertos, resueltos } = aciertosDe(j, col);
        base[col].aciertos += aciertos; base[col].resueltos += resueltos; base[col].mejor = Math.max(base[col].mejor, aciertos);
      });
      const e8 = elige8Info(j);
      if (e8.completo) { base.e8.jornadas += 1; base.e8.aciertos += e8.aciertos; base.e8.resueltos += e8.resueltos; base.e8.mejor = Math.max(base.e8.mejor, e8.aciertos); }
      const p = plenoAcertado(j);
      if (p !== null) { base.jornadasConPleno += 1; if (p) base.plenos += 1; }
    });
    return base;
  }, [data.jornadas]);
  const pct = (obj) => (obj.resueltos > 0 ? ((obj.aciertos / obj.resueltos) * 100).toFixed(0) : "—");
  return (
    <div className="space-y-4 mt-4">
      <div className="grid sm:grid-cols-2 gap-4">
        {["A", "B"].map((col) => (
          <div key={col} className="boleto rounded-md p-5">
            <h2 className="text-lg font-black text-[#1A1A1A] mb-3">{data.personas[col]}</h2>
            <div className="space-y-2 text-sm">
              <Fila etiqueta="Aciertos totales (sobre 14)" valor={stats[col].aciertos} />
              <Fila etiqueta="% de aciertos" valor={pct(stats[col]) === "—" ? "—" : `${pct(stats[col])}%`} />
              <Fila etiqueta="Mejor jornada" valor={`${stats[col].mejor}/14`} />
            </div>
            <div className="mt-4 h-2 rounded-full bg-[#1A1A1A]/10 overflow-hidden"><div className="h-full bg-[#E30613]" style={{ width: `${pct(stats[col]) === "—" ? 0 : pct(stats[col])}%` }} /></div>
          </div>
        ))}
      </div>
      <div className="grid sm:grid-cols-2 gap-4">
        <div className="boleto rounded-md p-5">
          <h2 className="text-lg font-black text-[#1A1A1A] mb-3">Elige 8</h2>
          <div className="space-y-2 text-sm">
            <Fila etiqueta="Jornadas con Elige 8 completo" valor={stats.e8.jornadas} />
            <Fila etiqueta="Aciertos totales (sobre 8)" valor={stats.e8.aciertos} />
            <Fila etiqueta="% de aciertos" valor={pct(stats.e8) === "—" ? "—" : `${pct(stats.e8)}%`} />
            <Fila etiqueta="Mejor jornada" valor={`${stats.e8.mejor}/8`} />
          </div>
        </div>
        <div className="boleto rounded-md p-5">
          <h2 className="text-lg font-black text-[#1A1A1A] mb-3">Pleno al 15</h2>
          <div className="space-y-2 text-sm">
            <Fila etiqueta="Jornadas con resultado" valor={stats.jornadasConPleno} />
            <Fila etiqueta="Plenos acertados" valor={stats.plenos} />
          </div>
        </div>
      </div>
      {data.jornadas.length === 0 && <p className="opacity-60 text-center py-8">Juega alguna jornada para ver estadísticas.</p>}
    </div>
  );
}

function Fila({ etiqueta, valor }) {
  return <div className="flex items-center justify-between border-b border-[#E5E5E5] pb-1.5"><span className="text-[#1A1A1A]/70">{etiqueta}</span><span className="font-bold text-[#1A1A1A]">{valor}</span></div>;
}

function Estilos() {
  return (
    <style>{`
      .logo-box { width: 34px; height: 34px; border: 2px solid white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.8rem; transform: rotate(-6deg); }
      .boleto { background: #FFFFFF; color: #1A1A1A; border: 1px solid #E5E5E5; }
      .input-plain { background: transparent; border: none; border-bottom: 1px solid #D0D0D0; padding: 1px 2px; font-size: 0.85rem; color: #1A1A1A; outline: none; }
      .input-plain:focus { border-bottom-color: #E30613; }
      .input-mini { background: #F2F2F2; border: 1px solid #D0D0D0; border-radius: 3px; padding: 2px 6px; font-size: 0.8rem; color: #1A1A1A; }
      .sidebar-jornadas { width: 100%; }
      @media (min-width: 640px) { .sidebar-jornadas { width: 200px; flex-shrink: 0; } }
      .ribbon { background: #F5F9FE; border: 1px solid #BBD6F0; border-radius: 4px; padding: 8px 12px; text-align: center; }
      .ribbon-text { font-size: 0.8rem; color: #1A1A1A; }
      .ribbon-arrow { color: #1565C0; font-weight: 900; }
      .elige8-logo { font-weight: 900; color: #1565C0; letter-spacing: 0.02em; }
      .elige8-ocho { color: #E30613; }
      .tabla-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .tabla-inner { min-width: 560px; }
      .fila-partido { display: flex; align-items: stretch; gap: 8px; }
      .partido-hueco { flex: 1; min-width: 190px; }
      .col-fija { width: 104px; flex-shrink: 0; }
      .partido-box { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 190px; border: 2px solid #1565C0; border-radius: 6px; padding: 7px 10px; background: white; cursor: pointer; text-align: left; transition: background 0.12s ease, border-color 0.12s ease; }
      .partido-box:hover { background: #F5F9FE; }
      .partido-marcado { background: #1565C0; border-color: #1565C0; }
      .partido-marcado .partido-num, .partido-marcado .partido-input, .partido-marcado span { color: white; }
      .partido-num { font-weight: 700; color: #1565C0; font-size: 0.85rem; flex-shrink: 0; }
      .partido-input { background: transparent; border: none; outline: none; color: #1565C0; font-size: 0.88rem; min-width: 0; flex: 1; }
      .partido-input::placeholder { color: rgba(21,101,192,0.4); }
      .partido-marcado .partido-input::placeholder { color: rgba(255,255,255,0.6); }
      .pick-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; border: 2px solid #E30613; border-radius: 6px; padding: 3px; background: #FFF5F5; }
      .pick-group-resultado { border-color: #2E7D32; background: #F3FAF3; }
      .casilla { aspect-ratio: 1; border-radius: 4px; border: 1.5px solid #E30613; background: white; color: #E30613; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; transition: all 0.12s ease; }
      .casilla-resultado { border-color: #2E7D32; color: #2E7D32; }
      .casilla-on { background: #E30613; color: white; border-color: #E30613; }
      .casilla-resultado.casilla-on { background: #2E7D32; color: white; border-color: #2E7D32; }
      .casilla.acierto { background: #2E7D32; color: white; border-color: #2E7D32; }
      .casilla.fallo { background: #EDEDED; color: #9A9A9A; border-color: #D0D0D0; }
      .tab-btn { padding: 10px 14px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: #1A1A1A; opacity: 0.45; border-bottom: 3px solid transparent; white-space: nowrap; }
      .tab-btn:hover { opacity: 0.8; }
      .tab-active { opacity: 1; border-bottom-color: #E30613; }
      .btn-rojo { background: #E30613; color: white; font-weight: 700; font-size: 0.85rem; padding: 8px 14px; border-radius: 4px; transition: filter 0.15s; }
      .btn-rojo:hover { filter: brightness(1.1); }
      .stat-box { background: #F5F5F5; border-radius: 4px; padding: 10px; }
      .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(0,0,0,0.5); }
      .stat-num { font-size: 1.3rem; font-weight: 800; color: #1A1A1A; }
    `}</style>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<QuinielaApp />);
</script>
</body>
</html>
